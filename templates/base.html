<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title if title else "Sec-IoT" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="dark-mode">
<header>
    <div class="logo">🖥️ Sec-IoT</div>
    <nav>
        <ul>
            {% if current_user.is_authenticated %}
                <li><a href="{{ url_for('dashboard') }}"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="{{ url_for('profile') }}"><i class="fas fa-user"></i> Profile</a></li>
                {% if current_user.is_admin %}
                    <li><a href="{{ url_for('admin_panel') }}"><i class="fas fa-user-shield"></i> Admin</a></li>
                {% endif %}
                <li><a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            {% else %}
                <li><a href="{{ url_for('login') }}">Login</a></li>
            {% endif %}
        </ul>
        <button id="mode-toggle"><i class="fas fa-moon"></i></button>
    </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
<!--<p>Created by Showkot Hosen | <a href="https://github.com/yourusername" target="_blank">GitHub</a></p>
-->
</footer>
<script>
const toggle = document.getElementById('mode-toggle');
toggle.addEventListener('click', ()=>{
    document.body.classList.toggle('dark-mode');
    document.body.classList.toggle('light-mode');
});
</script>
</body>
</html>
